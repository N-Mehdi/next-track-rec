# Paths are relative to the repository root unless absolute.
# On Kaggle, override paths.prepared with the attached dataset folder.
paths:
  raw: data/raw
  prepared: data/prepared
  # Float32 copy of the audio embeddings, built on first use.
  audio: data/audio
  # Retrieval bundle of the service, written by nexttrack.serve.export.
  retrieval: artifacts/retrieval
  checkpoints: checkpoints
  outputs: outputs
  reports: reports

data:
  # Main event stream: listens with played_ratio_pct >= 50 (Listen+).
  stream: listens
  # Hub revision of yandex/yambda the raw files come from.
  revision: dd6f3a19eef5866e346c3270e098baa641a44948

split:
  # 0 is the official split; 30 moves every boundary 30 days earlier (replay, phase MLOps).
  shift_days: 0

spark:
  master: "local[10]"
  driver_memory: "20g"
  shuffle_partitions: 64

sasrec:
  run_name: a
  max_seq_len: 200
  embedding_dim: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  # Uniform negatives shared by the whole batch.
  num_negatives: 2048
  batch_size: 256
  learning_rate: 0.001
  epochs: 20
  patience: 3
  # Sliding window stride over each user history, in events.
  window_stride: 100
  fp16: true
  device: auto
  seed: 42
  eval_batch_size: 256
  # Items kept per user for the candidate stage.
  num_retrieved: 200
  # Smoke tests only; null runs full epochs.
  max_steps_per_epoch: null

candidates:
  # Retriever outputs (candidates_val.parquet, candidates_test.parquet, model.pt).
  sasrec_dir: outputs/a_d128_e60
  audio_dir: outputs/audio_knn
  # Quotas of the union, filled up to total with the next SASRec items.
  sasrec: 100
  history: 50
  audio: 30
  decay_pop: 20
  total: 200
  # Decay periods in hours, weight 0.9 per period (selected on validation in phase 1).
  decay_pop_hours: 2
  history_hours: 24
  # Last tracks averaged for the audio query (selected in phase 3).
  audio_history_items: 5

rerank:
  objective: lambdarank
  num_leaves: 63
  learning_rate: 0.05
  # Maximum rounds; the number used is chosen by cross-validation on the validation users.
  num_rounds: 500
  folds: 5
  seed: 42
  # 0 uses every core; the non-regression check uses 1.
  num_threads: 0
  # Post-processing variant: one position in every audio_every kept for the audio kNN.
  audio_every: 10
  # Audio similarity features (audio_score, audio_last_score).
  audio_features: true
  # Outputs go to paths.outputs/<name>, the report to paths.reports/<name>.json.
  name: reranker

eval:
  k_values: [10, 50, 100]

production:
  # The deployed variant has no audio file: no audio source, no audio feature. Trained by
  # the pipeline stage reranker_production; only its versions are registered in MLflow.
  overrides: ["candidates.audio=0", "rerank.audio_features=false", "rerank.name=reranker_production"]

tracking:
  # Every reranker training is logged to the local MLflow of docker-compose.yml.
  enabled: true
  uri: http://localhost:5000
  model_name: nexttrack-reranker
  # Promotion to production publishes the model there for the deployed service.
  hf_repo: N-Mehdi/nexttrack-reranker
  # Retrieval bundle of the service (SASRec encoder, item vectors, item tables).
  retrieval_repo: N-Mehdi/nexttrack-retrieval
  hf_private: false
  # Deployment where promotions write the model revisions (deployed by the CD on push).
  k8s_manifest: k8s/deployment.yaml
