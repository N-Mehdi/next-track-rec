# Paths are relative to the repository root unless absolute.
# On Kaggle, override paths.prepared with the attached dataset folder.
paths:
  raw: data/raw
  prepared: data/prepared
  # Float32 copy of the audio embeddings, built on first use.
  audio: data/audio
  # Service files written by nexttrack.serve.export.
  artifacts: artifacts
  checkpoints: checkpoints
  outputs: outputs
  reports: reports

data:
  # Main event stream: listens with played_ratio_pct >= 50 (Listen+).
  stream: listens
  # Users kept for local smoke tests (null = all users).
  max_users: null

spark:
  master: "local[10]"
  driver_memory: "20g"
  shuffle_partitions: 64

sasrec:
  run_name: a
  max_seq_len: 200
  embedding_dim: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  # Uniform negatives shared by the whole batch.
  num_negatives: 2048
  batch_size: 256
  learning_rate: 0.001
  epochs: 20
  patience: 3
  # Sliding window stride over each user history, in events.
  window_stride: 100
  fp16: true
  device: auto
  seed: 42
  eval_batch_size: 256
  # Items kept per user for the candidate stage.
  num_retrieved: 200
  # Smoke tests only; null runs full epochs.
  max_steps_per_epoch: null

candidates:
  # Retriever outputs (candidates_val.parquet, candidates_test.parquet, model.pt).
  sasrec_dir: outputs/a_d128_e60
  audio_dir: outputs/audio_knn
  # Quotas of the union, filled up to total with the next SASRec items.
  sasrec: 100
  history: 50
  audio: 30
  decay_pop: 20
  total: 200
  # Decay periods in hours, weight 0.9 per period (selected on validation in phase 1).
  decay_pop_hours: 2
  history_hours: 24
  # Last tracks averaged for the audio query (selected in phase 3).
  audio_history_items: 5

rerank:
  objective: lambdarank
  num_leaves: 63
  learning_rate: 0.05
  # Maximum rounds; the number used is chosen by cross-validation on the validation users.
  num_rounds: 500
  folds: 5
  seed: 42
  # Post-processing variant: one position in every audio_every kept for the audio kNN.
  audio_every: 10

eval:
  k_values: [10, 50, 100]
