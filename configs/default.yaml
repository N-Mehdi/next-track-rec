# Paths are relative to the repository root unless absolute.
# On Kaggle, override paths.prepared with the attached dataset folder.
paths:
  raw: data/raw
  prepared: data/prepared
  checkpoints: checkpoints
  outputs: outputs
  reports: reports

data:
  # Main event stream: listens with played_ratio_pct >= 50 (Listen+).
  stream: listens
  # Users kept for local smoke tests (null = all users).
  max_users: null

spark:
  master: "local[10]"
  driver_memory: "20g"
  shuffle_partitions: 64

sasrec:
  run_name: a
  max_seq_len: 200
  embedding_dim: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  # Uniform negatives shared by the whole batch.
  num_negatives: 2048
  batch_size: 256
  learning_rate: 0.001
  epochs: 20
  patience: 3
  # Sliding window stride over each user history, in events.
  window_stride: 100
  fp16: true
  device: auto
  seed: 42
  eval_batch_size: 256
  # Items kept per user for the candidate stage.
  num_retrieved: 200
  # Smoke tests only; null runs full epochs.
  max_steps_per_epoch: null

cold_start:
  # Number of last listened tracks averaged for the audio query.
  history_items: 20
  num_neighbours: 50

candidates:
  sasrec: 100
  audio: 50
  decay_pop: 50
  # Popularity decay: weight 0.9 per period, in hours (selected on validation).
  decay_hours: 2

rerank:
  objective: lambdarank
  num_leaves: 63
  learning_rate: 0.05
  num_rounds: 500
  early_stopping_rounds: 30

eval:
  k_values: [10, 50, 100]
