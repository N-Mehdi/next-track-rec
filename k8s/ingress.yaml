apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexttrack
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexttrack-mehdii01.lab.sspcloud.fr
  rules:
    - host: nexttrack-mehdii01.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexttrack
                port:
                  number: 8000
