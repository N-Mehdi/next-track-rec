[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexttrack"
version = "0.1.0"
description = "Next-track music recommendation on Yambda-50M: retrieval and reranking"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# Local data preparation. Spark 4 is required with Java 21.
prep = ["pyspark>=4.0"]
# Model training and candidate generation (Kaggle T4 or local GPU).
train = [
    "torch>=2.2",
    "faiss-cpu>=1.8",
    "lightgbm>=4.3",
    "onnxmltools>=1.12",
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
# CPU inference service.
serve = ["fastapi>=0.110", "uvicorn>=0.29", "onnxruntime>=1.17", "faiss-cpu>=1.8"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
